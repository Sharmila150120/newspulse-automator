<!DOCTYPE html>
<html>
<head>
    <title>NewsPulse Automator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-10">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-4xl font-bold text-orange-500 mb-2">NEWSPULSE 📡</h1>
        <p class="text-slate-500 mb-10">Real-time technology intelligence feed.</p>

        <div class="grid gap-4">
            {% for story in news %}
            <a href="{{ story.url }}" target="_blank" 
               class="p-6 bg-slate-900 border border-slate-800 rounded-2xl hover:border-orange-500 transition-all hover:bg-slate-800 block">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-semibold">{{ story.title }}</h2>
                    <span class="text-orange-500 text-2xl">→</span>
                </div>
                <p class="text-slate-500 text-sm mt-2">Source: BBC Tech News</p>
            </a>
            {% endfor %}
        </div>

        {% if not news %}
        <p class="text-red-400">No news found. Check your internet connection or the scraper logic.</p>
        {% endif %}
    </div>
</body>
</html>
